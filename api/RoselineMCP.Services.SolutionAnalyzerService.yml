  summary: Analyzes a C# solution for diagnostics with filtering options.
  example: []
  syntax:
    content: public Task<AnalyzeSolutionResponse> AnalyzeSolutionAsync(string pathOrGit, string? branch = null, string? includePattern = null, string? excludePattern = null, string? severity = null, int maxDiagnostics = 100)
    parameters:
    - id: pathOrGit
      type: System.String
      description: Path to solution file, directory containing .sln file, or Git repository URL.
    - id: branch
      type: System.String
      description: Git branch name (only used if pathOrGit is a Git URL).
    - id: includePattern
      type: System.String
      description: Include pattern for project names.
    - id: excludePattern
      type: System.String
      description: Exclude pattern for project names.
    - id: severity
      type: System.String
      description: Minimum severity level to include.
    - id: maxDiagnostics
      type: System.Int32
      description: Maximum number of diagnostics to return.
