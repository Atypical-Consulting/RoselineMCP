  syntax:
    content: Task<ApplyFixesResponse> ApplyFixesAsync(string project, List<string> ids, bool previewOnly = false)
    parameters:
    - id: project
      type: System.String
      description: Project name or path to .csproj file.
    - id: ids
      type: System.Collections.Generic.List{System.String}
      description: List of diagnostic IDs to fix.
    - id: previewOnly
      type: System.Boolean
      description: If true, only preview changes without applying them.
    return:
      type: System.Threading.Tasks.Task{RoselineMCP.Models.ApplyFixesResponse}
      description: Response containing changed files, patch, and fix statistics.
