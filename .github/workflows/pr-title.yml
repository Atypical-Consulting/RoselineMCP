name: PR title

# Asserts the PR title against a Conventional Commits pattern. `squash_merge_commit_title` is
# PR_TITLE, so this title is what lands on `dev` verbatim — and release-please parses that subject
# to decide the version bump and the changelog entry. A title with no type produces no release
# entry, silently, with no failed workflow anywhere: this check is what turns that into a red PR
# instead.
#
# Deliberately separate from ci.yml: that workflow is the build matrix, and a title check has no
# business gating on it or inheriting its triggers. No checkout, no token beyond the default — it
# only reads github.event.pull_request.title.
on:
  pull_request:
    # `edited` matters: without it, a title fixed after the workflow's first run never re-checks,
    # and the PR would sit green on a stale verdict.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'
          if ! echo "$TITLE" | grep -Eq "$PATTERN"; then
            echo "::error::PR title \"$TITLE\" is not a Conventional Commit. Use <type>[(scope)]: <subject>, where type is one of feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert (optionally scoped, optionally suffixed with '!' for a breaking change) — e.g. 'fix(loader): handle a missing solution file'."
            exit 1
          fi
