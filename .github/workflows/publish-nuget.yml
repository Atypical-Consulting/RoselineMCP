name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # required to create the GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Stamp MCP manifest version from tag
        run: |
          jq --arg v "${{ steps.version.outputs.VERSION }}" \
            '.version = $v | .packages[0].version = $v' \
            .mcp/server.json > .mcp/server.json.tmp
          mv .mcp/server.json.tmp .mcp/server.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Pack
        run: |
          dotnet pack RoselineMCP/RoselineMCP.csproj \
            -c Release \
            --no-build \
            -p:MinVerVersionOverride=${{ steps.version.outputs.VERSION }} \
            -o ./nupkg

      # Assert the artifact is actually correct BEFORE it leaves the building. A green
      # `dotnet pack` only means the command exited 0 - it does not prove the McpServer package
      # contains its manifest or that the manifest version matches the release. Shipping a package
      # with a missing/stale `.mcp/server.json` is exactly what sent `dnx` clients an ancient
      # 1.0.0. Fail loudly here rather than discover it from a user weeks later.
      - name: Verify packaged MCP manifest
        run: |
          want="${{ steps.version.outputs.VERSION }}"
          pkg="$(ls ./nupkg/*.nupkg | head -1)"
          echo "Inspecting $pkg (expecting manifest version $want)"
          manifest="$(unzip -p "$pkg" .mcp/server.json 2>/dev/null || true)"
          if [ -z "$manifest" ]; then
            echo "::error::.mcp/server.json is missing from $pkg - the McpServer package would ship without its manifest, so dnx clients cannot resolve it correctly."
            exit 1
          fi
          got_top="$(echo "$manifest" | jq -r '.version')"
          got_pkg="$(echo "$manifest" | jq -r '.packages[0].version')"
          echo "manifest .version=$got_top  .packages[0].version=$got_pkg"
          if [ "$got_top" != "$want" ] || [ "$got_pkg" != "$want" ]; then
            echo "::error::Packaged manifest version mismatch (expected $want, got .version=$got_top .packages[0].version=$got_pkg). It would tell dnx clients to fetch the wrong version."
            exit 1
          fi
          echo "Manifest OK: version $want is embedded and consistent."

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # A git tag is not a GitHub Release - one must be created explicitly. Do it here, after a
      # successful NuGet push, so every published version has a matching Release with notes and the
      # .nupkg attached. Idempotent so a re-run of the workflow on the same tag heals rather than errors.
      - name: Extract release notes from CHANGELOG
        run: |
          want="${{ steps.version.outputs.VERSION }}"
          # Literal string match (index==1), not regex: a version like "1.3.0" contains "."
          # metacharacters and "[" is a regex bracket-expression opener, so a dynamic regex here
          # is fragile across awk implementations. index() sidesteps all of that.
          awk -v hdr="## [$want]" '
            index($0, hdr) == 1 {f=1; next}
            f && index($0, "## [") == 1 {exit}
            f {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section found for $want; using a generic note."
            echo "Release v$want" > release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want="${{ steps.version.outputs.VERSION }}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists - updating notes and assets."
            gh release edit "$GITHUB_REF_NAME" --title "v$want" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" ./nupkg/*.nupkg --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "v$want" \
              --notes-file release-notes.md \
              --verify-tag \
              ./nupkg/*.nupkg
          fi
