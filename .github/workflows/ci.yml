name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The repo has no packages.lock.json, so setup-dotnet's `cache: true` (which requires
      # lock files) cannot be used - cache the global NuGet package folder directly instead.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Coverage is only gated and uploaded on ubuntu (below), so only instrument the
      # ubuntu leg - coverlet instrumentation on windows/macos was pure slowdown.
      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: dotnet test --no-build -c Release

      - name: Test with Coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet test --no-build -c Release \
            -p:CollectCoverage=true \
            -p:CoverletOutputFormat=cobertura \
            -p:CoverletOutput=./TestResults/coverage.cobertura.xml \
            "-p:Include=[RoselineMCP]*" \
            "-p:Exclude=[RoselineMCP.Tests]*" \
            -p:ExcludeByFile="**/Program.cs" \
            --logger "trx;LogFileName=test-results.trx"

      - name: Check coverage threshold
        if: matrix.os == 'ubuntu-latest'
        run: |
          # coverlet.msbuild writes the report to exactly this path (CoverletOutput above
          # is resolved relative to the test project). Read it directly rather than
          # searching - a filesystem-order-dependent `find | head -1` could pick up a
          # GUID-named report from another collector that measures a different scope.
          COVERAGE_FILE="RoselineMCP.Tests/TestResults/coverage.cobertura.xml"
          if [ ! -f "$COVERAGE_FILE" ]; then
            echo "❌ No coverage report found at $COVERAGE_FILE"
            exit 1
          fi
          echo "Found coverage report: $COVERAGE_FILE"
          COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' "$COVERAGE_FILE" | head -1)
          PERCENT=$(echo "$COVERAGE * 100" | bc)
          echo "Coverage: $PERCENT%"
          if (( $(echo "$PERCENT < 80" | bc -l) )); then
            echo "❌ Coverage $PERCENT% is below the 80% threshold"
            exit 1
          fi
          echo "✅ Coverage $PERCENT% meets the 80% threshold"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: test-results
          path: "**/*.trx"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: coverage-report
          path: RoselineMCP.Tests/TestResults/coverage.cobertura.xml
