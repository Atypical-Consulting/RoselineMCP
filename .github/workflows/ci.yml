name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test with Coverage
        run: |
          dotnet test --no-build -c Release \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput=./TestResults/coverage.cobertura.xml \
            "/p:Include=[RoselineMCP]*" \
            "/p:Exclude=[RoselineMCP.Tests]*" \
            /p:ExcludeByFile="**/Program.cs" \
            --logger "trx;LogFileName=test-results.trx"

      - name: Check coverage threshold
        run: |
          # Use a path-specific search to avoid picking up GUID-based coverage
          # files generated by Microsoft.Testing.Extensions.CodeCoverage alongside
          # the coverlet.msbuild output. The GUID files (e.g. TestResults/<guid>/
          # coverage.cobertura.xml) report pre-Sprint-3 numbers (~51%) because they
          # measure a different scope. We want the coverlet output which is written
          # directly to TestResults/coverage.cobertura.xml (no GUID subdirectory).
          COVERAGE_FILE=$(find RoselineMCP.Tests -name "coverage.cobertura.xml" | head -1)
          if [ -z "$COVERAGE_FILE" ]; then
            echo "❌ No coverage report found"
            exit 1
          fi
          echo "Found coverage report: $COVERAGE_FILE"
          COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' "$COVERAGE_FILE" | head -1)
          PERCENT=$(echo "$COVERAGE * 100" | bc)
          echo "Coverage: $PERCENT%"
          if (( $(echo "$PERCENT < 80" | bc -l) )); then
            echo "❌ Coverage $PERCENT% is below the 80% threshold"
            exit 1
          fi
          echo "✅ Coverage $PERCENT% meets the 80% threshold"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: "**/*.trx"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: "**/coverage.cobertura.xml"
