name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The repo has no packages.lock.json, so setup-dotnet's `cache: true` (which requires
      # lock files) cannot be used - cache the global NuGet package folder directly instead.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Coverage is only gated and uploaded on ubuntu (below), so only instrument the
      # ubuntu leg - coverage instrumentation on windows/macos was pure slowdown.
      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: dotnet test --no-build -c Release

      # `dotnet test` runs in Microsoft.Testing.Platform mode (see global.json), so these are
      # MTP options, not VSTest ones: `--logger trx` and the coverlet `-p:` properties are not
      # merely renamed here, they no longer do anything at all. Coverage scope needs no
      # include/exclude filters: only the project's own modules are instrumented (the test
      # assembly is not), and Program.cs is already carved out by its [ExcludeFromCodeCoverage].
      - name: Test with Coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet test --no-build -c Release \
            --coverage \
            --coverage-output-format cobertura \
            --coverage-output coverage.cobertura.xml \
            --report-trx \
            --report-trx-filename test-results.trx \
            --results-directory RoselineMCP.Tests/TestResults

      - name: Check coverage threshold
        if: matrix.os == 'ubuntu-latest'
        run: |
          # The code coverage extension writes the report to exactly this path
          # (--coverage-output is resolved inside --results-directory above). Read it
          # directly rather than searching - a filesystem-order-dependent `find | head -1`
          # could pick up a GUID-named report from another collector that measures a
          # different scope.
          COVERAGE_FILE="RoselineMCP.Tests/TestResults/coverage.cobertura.xml"
          if [ ! -f "$COVERAGE_FILE" ]; then
            echo "❌ No coverage report found at $COVERAGE_FILE"
            exit 1
          fi
          echo "Found coverage report: $COVERAGE_FILE"
          COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' "$COVERAGE_FILE" | head -1)
          PERCENT=$(echo "$COVERAGE * 100" | bc)
          echo "Coverage: $PERCENT%"
          if (( $(echo "$PERCENT < 80" | bc -l) )); then
            echo "❌ Coverage $PERCENT% is below the 80% threshold"
            exit 1
          fi
          echo "✅ Coverage $PERCENT% meets the 80% threshold"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: test-results
          path: "**/*.trx"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: coverage-report
          path: RoselineMCP.Tests/TestResults/coverage.cobertura.xml
