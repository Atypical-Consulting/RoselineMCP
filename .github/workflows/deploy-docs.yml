name: Deploy documentation site

# Builds the Astro site in website/ and publishes it to GitHub Pages.
# One-time setup: repository Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [dev]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-docs.yml'
  # The /releases page is generated from the GitHub Releases API at build time, so it has to be
  # rebuilt after a release. That is driven by release-please.yml's `publish` job, which ends with
  # `gh workflow run deploy-docs.yml` — workflow_dispatch and repository_dispatch are the documented
  # exceptions to GitHub's rule that GITHUB_TOKEN-created events do not trigger workflows, so the
  # dispatch fires where a `release:` trigger would not.
  #
  # A `workflow_run` on release-please.yml would NOT be the equivalent: that workflow runs on every
  # push to `dev`, so it would rebuild and redeploy the site on every dev push, bypassing the paths
  # filter above. The previous `workflow_run` here named "Publish NuGet", a tag-triggered workflow
  # that no longer exists — a dead trigger that could never fire again.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build with Astro
        run: npm run build
        env:
          # Authenticates the build-time GitHub Releases fetch in releases.astro (avoids the
          # 60/hr unauthenticated rate limit). Read-only; the default token suffices.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d3.outputs.page_url || steps.d2.outputs.page_url || steps.d1.outputs.page_url }}
    steps:
      # GitHub Pages' deployment API intermittently returns "Deployment failed, try again later" —
      # a backend hiccup unrelated to the build, which clears on a plain re-run. Try up to 3 times;
      # the first two tolerate failure (continue-on-error) so a transient miss doesn't fail the job,
      # and only the last attempt can fail it.
      - name: Deploy to GitHub Pages (attempt 1)
        id: d1
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Deploy to GitHub Pages (attempt 2)
        id: d2
        if: steps.d1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Deploy to GitHub Pages (attempt 3)
        id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v5
