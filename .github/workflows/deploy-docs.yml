name: Deploy documentation site

# Builds the Astro site in website/ and publishes it to GitHub Pages.
# One-time setup: repository Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [dev]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-docs.yml'
  # Rebuild when a release is published/edited/removed so the /releases page (generated from the
  # GitHub Releases API at build time) stays in sync without a manual website change.
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci || npm install
      - name: Build with Astro
        run: npm run build
        env:
          # Authenticates the build-time GitHub Releases fetch in releases.astro (avoids the
          # 60/hr unauthenticated rate limit). Read-only; the default token suffices.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
