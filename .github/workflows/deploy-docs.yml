name: Deploy documentation site

# Builds the Astro site in website/ and publishes it to GitHub Pages.
# One-time setup: repository Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [dev]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-docs.yml'
  # Rebuild after the release workflow finishes so the /releases page (generated from the GitHub
  # Releases API at build time) picks up the new release. A `release:` trigger would NOT work here:
  # the release is created by the publish workflow's GITHUB_TOKEN, and GitHub deliberately does not
  # fire workflows from token-created events. `workflow_run` keys off the workflow's completion
  # (its original trigger was a human tag push), so it fires - regardless of the publish outcome,
  # so a failed registry step still refreshes the page with whatever release was created.
  workflow_run:
    workflows: ["Publish NuGet"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci || npm install
      - name: Build with Astro
        run: npm run build
        env:
          # Authenticates the build-time GitHub Releases fetch in releases.astro (avoids the
          # 60/hr unauthenticated rate limit). Read-only; the default token suffices.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
